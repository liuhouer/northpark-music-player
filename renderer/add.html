<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>添加音乐</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./dark.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
          integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8f9fa;
        color: #333;
        overflow: hidden;
      }
      .import-wrapper {
        max-width: 520px;
        margin: 0 auto;
        padding: 20px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .import-header h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .import-header h1 i { color: #4f46e5; }
      .import-subtitle {
        font-size: 12px;
        color: #888;
        margin-bottom: 14px;
        padding-left: 28px;
      }
      .import-stats {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #e9ecef;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .stats-count { color: #4f46e5; font-weight: 600; }
      .stats-size { color: #888; margin-left: 10px; }
      .btn-clear {
        background: transparent;
        border: none;
        color: #e74c3c;
        font-size: 12px;
        cursor: pointer;
        padding: 4px 10px;
        border-radius: 6px;
        transition: all 0.2s;
        display: none;
        align-items: center;
        gap: 4px;
      }
      .btn-clear:hover { background: rgba(231, 76, 60, 0.08); }
      .import-list {
        flex: 1;
        min-height: 0;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #e9ecef;
        overflow-y: auto;
        margin-bottom: 12px;
      }
      .import-list::-webkit-scrollbar { width: 5px; }
      .import-list::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 3px;
      }
      .file-item {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #f5f5f5;
        transition: background 0.15s;
        position: relative;
      }
      .file-item:hover { background: #f8f9fa; }
      .file-item:last-child { border-bottom: none; }
      .file-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 10px;
        flex-shrink: 0;
        font-size: 12px;
      }
      .file-info { flex: 1; min-width: 0; }
      .file-name {
        font-size: 12px;
        font-weight: 500;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file-meta {
        font-size: 11px;
        color: #aaa;
        margin-top: 1px;
      }
      .file-remove {
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        color: #ccc;
        cursor: pointer;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.2s;
        flex-shrink: 0;
        font-size: 11px;
      }
      .file-item:hover .file-remove { opacity: 1; }
      .file-remove:hover {
        background: rgba(231, 76, 60, 0.1);
        color: #e74c3c;
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #ccc;
        text-align: center;
        padding: 30px 20px;
      }
      .empty-state i {
        font-size: 40px;
        margin-bottom: 10px;
        opacity: 0.4;
      }
      .empty-state p { font-size: 13px; margin-bottom: 2px; color: #bbb; }
      .empty-hint { font-size: 11px; color: #d1d5db; }
      .import-actions { display: flex; flex-direction: column; gap: 8px; }
      .action-row {
        display: flex;
        gap: 8px;
      }
      .action-row button, .import-actions > button {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .btn-select-file {
        background: #eef2ff;
        color: #4f46e5;
        border: 1px solid #c7d2fe;
      }
      .btn-select-file:hover { background: #e0e7ff; }
      .btn-select-folder {
        background: #f0fdf4;
        color: #16a34a;
        border: 1px solid #bbf7d0;
      }
      .btn-select-folder:hover { background: #dcfce7; }
      .btn-import {
        background: #4f46e5;
        color: #fff;
      }
      .btn-import:hover:not(:disabled) { background: #4338ca; }
      .btn-import:disabled {
        background: #e5e7eb;
        color: #9ca3af;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="import-wrapper">
      <div class="import-header">
        <h1><i class="fas fa-music"></i>添加音乐到曲库</h1>
        <p class="import-subtitle">支持 MP3、FLAC、WAV、AAC、OGG、M4A 格式</p>
      </div>

      <div class="import-stats" id="import-stats">
        <div>
          <span class="stats-count" id="stats-count">0 首</span>
          <span class="stats-size" id="stats-size">0 MB</span>
        </div>
        <button class="btn-clear" id="clear-list">
          <i class="fas fa-trash-alt"></i> 清空
        </button>
      </div>

      <div class="import-list" id="musicList">
        <div class="empty-state">
          <i class="fas fa-music"></i>
          <p>您还未选择任何音乐文件</p>
          <p class="empty-hint">点击下方按钮选择文件或导入文件夹</p>
        </div>
      </div>

      <div class="import-actions">
        <div class="action-row">
          <button type="button" id="select-music" class="btn-select-file">
            <i class="fas fa-file-audio"></i> 选择音乐
          </button>
          <button type="button" id="select-folder" class="btn-select-folder">
            <i class="fas fa-folder-open"></i> 导入文件夹
          </button>
        </div>
        <button type="button" id="add-music" class="btn-import" disabled>
          <i class="fas fa-download"></i> 导入音乐
        </button>
      </div>
    </div>
    <script>
      require('./add.js')
    </script>
  </body>
</html>
